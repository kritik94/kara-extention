<!doctype html>
<meta charset="utf-8" />
<style>
  body { width: 240px; margin: 0; padding: 14px; font: 14px system-ui; background: #1a1a1a; color: #eee; }
  button { width: 100%; padding: 12px; font: inherit; cursor: pointer; color: #eee;
    background: #2b2b2b; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; }
  button:hover { border-color: rgba(255,255,255,.3); }
  button.on { color: #9df2a6; background: rgba(62,207,74,.16); border-color: rgba(62,207,74,.55); }
  p { margin: 10px 0 0; color: #888; font-size: 12px; }
</style>
